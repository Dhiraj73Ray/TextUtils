{% extends "base.html" %}

{% block title %}Result — TextUtils{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-9">

        <!-- Header -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div>
                <h1 class="h3 mb-0">Analysis Result</h1>
                <p class="text-muted mb-0 small">
                    Operation{{ ana|length|pluralize }} performed:
                    <span class="badge bg-primary">{{ ana }}</span>
                </p>
            </div>
            <a href="{% url 'index' %}" class="btn btn-outline-secondary">
                &larr; Analyze Another
            </a>
        </div>

        <!-- Result Card -->
        <div class="card shadow-sm">
            <div class="card-header bg-light d-flex justify-content-between align-items-center">
                <span class="fw-semibold">Result</span>
                <button
                    type="button"
                    class="btn btn-sm btn-outline-primary"
                    id="copyBtn"
                >
                    Copy
                </button>
            </div>
            <div class="card-body">
                <textarea
                    class="form-control font-monospace"
                    id="resultText"
                    rows="12"
                    readonly
                >{{ analyzed_text }}</textarea>
            </div>
            <div class="card-footer bg-light text-muted small d-flex justify-content-between">
                <span>Characters: <strong id="charCount">0</strong></span>
                <span>Words: <strong id="wordCount">0</strong></span>
                <span>Lines: <strong id="lineCount">0</strong></span>
            </div>
        </div>

    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    (function () {
        const resultEl = document.getElementById('resultText');
        const copyBtn  = document.getElementById('copyBtn');
        const charEl   = document.getElementById('charCount');
        const wordEl   = document.getElementById('wordCount');
        const lineEl   = document.getElementById('lineCount');

        if (!resultEl) return;

        // Live stats
        function updateStats() {
            const val = resultEl.value || '';
            charEl.textContent = val.length;
            wordEl.textContent = val.trim() === '' ? 0 : val.trim().split(/\s+/).length;
            lineEl.textContent = val === '' ? 0 : val.split(/\r\n|\r|\n/).length;
        }
        updateStats();

        // Copy to clipboard
        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(resultEl.value);
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.remove('btn-outline-primary');
                copyBtn.classList.add('btn-success');
                setTimeout(() => {
                    copyBtn.textContent = 'Copy';
                    copyBtn.classList.remove('btn-success');
                    copyBtn.classList.add('btn-outline-primary');
                }, 1500);
            } catch (err) {
                // Fallback for older browsers / insecure contexts
                resultEl.select();
                document.execCommand('copy');
                copyBtn.textContent = 'Copied!';
                setTimeout(() => (copyBtn.textContent = 'Copy'), 1500);
            }
        });
    })();
</script>
{% endblock %}
